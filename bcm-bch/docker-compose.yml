{
  "services": {
    "app_proxy": {
      "environment": {
        "APP_HOST": "bcm-bch_node_1",
        "APP_PORT": "8090"
      }
    },
    "node": {
      "image": "ghcr.io/doch2020/bcm-bch:0.1.0-beta.3@sha256:c75ab49b1bf4978a7bfa8a3bd567b3cc5880811bf048eaef37a5329148da255d",
      "platform": "linux/amd64",
      "user": "1000:1000",
      "init": true,
      "restart": "on-failure",
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "tmpfs": [
        "/tmp:rw,size=64m,mode=1777"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "command": [
        "node"
      ],
      "mem_limit": "2g",
      "cpus": 2,
      "stop_grace_period": "180s",
      "volumes": [
        "${APP_DATA_DIR}/data/chain:/node",
        "${APP_DATA_DIR}/data/settings:/settings:ro"
      ],
      "ports": [
        "3360:3360/tcp",
        "4360:4360/tcp"
      ],
      "depends_on": [],
      "healthcheck": {
        "test": [
          "CMD",
          "python3",
          "-c",
          "import subprocess;from common import load_node_settings;raise SystemExit(0 if load_node_settings('/settings') is None else subprocess.call(['bitcoin-cli','-datadir=/node','-rpcport=18332','getblockchaininfo'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL))"
        ],
        "interval": "30s",
        "timeout": "10s",
        "retries": 3,
        "start_period": "60s"
      }
    },
    "pool": {
      "image": "ghcr.io/doch2020/bcm-bch:0.1.0-beta.3@sha256:c75ab49b1bf4978a7bfa8a3bd567b3cc5880811bf048eaef37a5329148da255d",
      "platform": "linux/amd64",
      "user": "1000:1000",
      "init": true,
      "restart": "on-failure",
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "tmpfs": [
        "/tmp:rw,size=64m,mode=1777"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "command": [
        "pool"
      ],
      "mem_limit": "512m",
      "cpus": 1,
      "stop_grace_period": "45s",
      "network_mode": "service:node",
      "depends_on": [
        "node"
      ],
      "volumes": [
        "${APP_DATA_DIR}/data/chain:/node:ro",
        "${APP_DATA_DIR}/data/settings:/settings:ro",
        "${APP_DATA_DIR}/data/pool:/pool"
      ]
    },
    "dashboard": {
      "image": "ghcr.io/doch2020/bcm-bch:0.1.0-beta.3@sha256:c75ab49b1bf4978a7bfa8a3bd567b3cc5880811bf048eaef37a5329148da255d",
      "platform": "linux/amd64",
      "user": "1000:1000",
      "init": true,
      "restart": "on-failure",
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "tmpfs": [
        "/tmp:rw,size=64m,mode=1777"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "command": [
        "dashboard"
      ],
      "mem_limit": "384m",
      "cpus": 0.5,
      "network_mode": "service:node",
      "depends_on": [
        "node"
      ],
      "environment": {
        "BCM_SETUP_PASSWORD": "${APP_PASSWORD}",
        "BCH_LAN_HOST": "${DEVICE_DOMAIN_NAME}"
      },
      "volumes": [
        "${APP_DATA_DIR}/data/chain:/node:ro",
        "${APP_DATA_DIR}/data/settings:/settings",
        "${APP_DATA_DIR}/data/pool:/pool:ro",
        "${APP_DATA_DIR}/data/telemetry:/telemetry"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "python3",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/setup/status',timeout=3).read()"
        ],
        "interval": "30s",
        "timeout": "5s",
        "retries": 3
      }
    }
  }
}
