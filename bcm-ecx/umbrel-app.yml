  "tagline": "Your ECX node and local SOLO pool",
  "description": "BETA — Linux AMD64 only. Run an unpruned ECX full node, enforcer, zero-fee SOLO pool and BCM dashboard. Requires 16 GB RAM; 2 TB SSD recommended. Enter your own ECX receiving address with the app password shown by Umbrel. Mining waits for chain synchronization and verified current templates. ECX is separate from BTC and XEC. Published community-store beta; independent Umbrel lifecycle testing is pending. Stratum V1 ports 3334/3335 are published on host interfaces; control remote access with your network firewall. No router forwarding is configured. Includes automatic sync peer discovery and persistent peer settings.",
  "releaseNotes": "Fixes worker latency in the native Umbrel app by starting the read-only collector, preserving existing miner endpoints, adding persistent Worker latency settings, and accepting AxeOS numeric fallback flags. Fresh active ECX connections are matched by full worker name; stale, foreign-pool and conflicting readings are excluded. LuxOS APIs without latency are explicitly unsupported. 17 embedded Linux tests passed. Node/enforcer binaries and mining policies are unchanged. External relay sidecars sharing the node namespace must be reattached after a full app update.",
