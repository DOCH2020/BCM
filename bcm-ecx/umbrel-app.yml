  "description": "BETA \u2014 Linux AMD64 only. Run an unpruned ECX full node, enforcer, zero-fee SOLO pool and BCM dashboard. Requires 16 GB RAM; 2 TB SSD recommended. Enter your own ECX receiving address with the app password shown by Umbrel. Mining waits for chain synchronization and verified current templates. ECX is separate from BTC and XEC. Published community-store beta; independent Umbrel lifecycle testing is pending. Stratum V1 ports 3334/3335 are published on host interfaces; control remote access with your network firewall. No router forwarding is configured. Includes automatic sync peer discovery and persistent peer settings.",
  "releaseNotes": "Adds automatic initial-sync peer assistance from this network's official DNS seeds, bounded retries and idle-helper replacement, persistent manual peer settings, connected/downloading counts and measured recent sync speed. Open Node status > Sync peer settings. Existing pruning, payouts, mining gates and data mounts are preserved. 8 embedded Linux tests passed, plus mobile settings checks. Native update/lifecycle acceptance remains pending. External services sharing the node network namespace must be reattached after a container update.",
