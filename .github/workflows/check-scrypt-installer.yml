name: Check Scrypt Hub installer
on:
  push:
    paths:
      - bcm-ltc-merged/**
      - tests/test_scrypt_installer.py
      - .github/workflows/check-scrypt-installer.yml
  pull_request:
    paths:
      - bcm-ltc-merged/**
      - tests/test_scrypt_installer.py
      - .github/workflows/check-scrypt-installer.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate executable lifecycle hooks
        run: |
          test -x bcm-ltc-merged/hooks/pre-start
          test -x bcm-ltc-merged/hooks/pre-install
          bash -n bcm-ltc-merged/hooks/pre-start
          bash -n bcm-ltc-merged/hooks/pre-install
      - name: Test fresh install, upgrade, data preservation and relocated storage
        run: sudo python3 -m unittest discover -s tests -p test_scrypt_installer.py -v
