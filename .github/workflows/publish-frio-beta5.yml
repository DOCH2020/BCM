name: Publish audited FRIO beta.5 image
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-frio-beta5.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-frio-beta-5
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch and verify audited pruning-enabled beta
        run: |
          curl --fail --location --retry 3 --output candidate.oci.tar https://bcmpool.online/bcm-frio-0.1.0-beta.5-amd64.oci.tar
          echo 'f24cbb53b46642955130dee02798edcc939900ea4f598634238eea64c5310c13  candidate.oci.tar' | sha256sum --check
      - name: Publish the verified image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo
          skopeo copy oci-archive:candidate.oci.tar docker-daemon:bcm-frio-audited:0.1.0-beta.5
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GH_ACTOR" --password-stdin
          if docker manifest inspect ghcr.io/doch2020/bcm-frio:0.1.0-beta.5 >/dev/null 2>&1; then
            echo 'The beta tag already exists; refusing to overwrite it.'
            exit 1
          fi
          printf '%s\n' 'FROM bcm-frio-audited:0.1.0-beta.5' 'LABEL org.opencontainers.image.source="https://github.com/DOCH2020/BCM" org.opencontainers.image.title="BCM FRIO Node (Beta)" org.opencontainers.image.version="0.1.0-beta.5"' > Dockerfile
          docker build --network=none --tag ghcr.io/doch2020/bcm-frio:0.1.0-beta.5 .
          docker push ghcr.io/doch2020/bcm-frio:0.1.0-beta.5
          docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/doch2020/bcm-frio:0.1.0-beta.5 | tee image-reference.txt
          cat image-reference.txt >> "$GITHUB_STEP_SUMMARY"