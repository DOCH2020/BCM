      "user": "1000:1000",
      "init": true,
      "restart": "on-failure",
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "tmpfs": [
        "/tmp:rw,size=64m,mode=1777"
