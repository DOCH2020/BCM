{
  "services": {
    "app_proxy": {
      "environment": {
        "APP_HOST": "bcm-ltc-merged_node_1",
        "APP_PORT": "8093"
      }
    },
    "node": {
      "image": "ghcr.io/doch2020/bcm-ltc-merged:0.1.0-beta.1@sha256:9891fdcff09960a7a77c148f689c200a3fc3814a6e94d92b66de79691b0d340c",
